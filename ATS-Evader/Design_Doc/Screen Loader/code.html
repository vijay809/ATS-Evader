<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_9');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }

  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;

varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

void main() {
    vec2 uv = v_texCoord;
    vec2 p = (uv - 0.5) * u_resolution.xy / min(u_resolution.x, u_resolution.y);
    
    // Deep dark background base
    vec3 color = vec3(0.04, 0.04, 0.05);
    
    // Cyber purple and electric blue influence
    vec3 color1 = vec3(0.1, 0.0, 0.2); // Deep Purple
    vec3 color2 = vec3(0.0, 0.1, 0.3); // Deep Blue
    
    float noise = hash(uv + floor(u_time * 5.0) * 0.01);
    
    // Flowing digital energy lines
    for(float i = 0.0; i < 4.0; i++) {
        float speed = 0.2 + i * 0.1;
        float y = fract(p.y + u_time * speed + i * 0.25);
        float line = smoothstep(0.005, 0.0, abs(y - 0.5) - 0.001);
        color += color1 * line * (1.0 - abs(p.x) * 2.0) * 0.5;
    }

    // Vignette
    float vig = 1.0 - smoothstep(0.4, 1.2, length(p));
    color *= vig;
    
    // Subtle scanline effect
    float scanline = sin(uv.y * 800.0) * 0.04;
    color -= scanline;
    
    // Slight digital noise
    color += noise * 0.015;

    gl_FragColor = vec4(color, 1.0);
}

  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);

    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const logs = [
                { status: '[ OK ]', text: 'INITIALIZING CORE MAPPING ENGINE...', type: 'ok' },
                { status: '[ INFO ]', text: 'CONNECTING TO SYNAPSE_AI NEURAL NET...', type: 'info' },
                { status: '[ OK ]', text: 'ESTABLISHED SECURE DATALINK.', type: 'ok' },
                { status: '[ OK ]', text: 'PARSING MASTER RESUME STRUCTURE...', type: 'ok' },
                { status: '[ INFO ]', text: 'LOADING HEURISTIC MATCHING ALGORITHMS...', type: 'info' },
                { status: '[ BUSY ]', text: 'COMPILING TALENT VECTORS...', type: 'busy' },
                { status: '[ OK ]', text: 'VECTORS COMPILED.', type: 'ok' },
                { status: '[ BUSY ]', text: 'SCANNING GLOBAL JOB BOARDS [14/14]', type: 'busy' },
                { status: '[ SUCCESS ]', text: 'IDENTITY VERIFIED: SYSTEM ACTIVE.', type: 'success' }
            ];

            const typeColors = {
                'ok': 'text-primary',
                'info': 'text-on-surface-variant',
                'busy': 'text-tertiary',
                'success': 'text-secondary font-bold shadow-[0_0_10px_rgba(236,178,255,0.5)]'
            };

            const terminalContent = document.getElementById('terminal-content');
            const terminalPrompt = document.getElementById('terminal-prompt');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            
            let logIndex = 0;
            let progress = 0;
            const totalTime = 4000; // 4 seconds total
            const intervalTime = totalTime / logs.length;

            // Log rendering
            const renderLog = () => {
                if (logIndex < logs.length) {
                    const log = logs[logIndex];
                    const div = document.createElement('div');
                    div.className = `log-line mb-1 flex gap-2`;
                    
                    const statusSpan = document.createElement('span');
                    statusSpan.className = `w-[80px] shrink-0 ${typeColors[log.type]}`;
                    statusSpan.textContent = log.status;
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = log.type === 'success' ? 'text-on-surface font-bold' : 'text-on-surface/80';
                    textSpan.textContent = log.text;

                    div.appendChild(statusSpan);
                    div.appendChild(textSpan);
                    
                    terminalContent.appendChild(div);
                    logIndex++;
                    
                    // Keep scroll at bottom
                    terminalContent.parentElement.scrollTop = terminalContent.parentElement.scrollHeight;

                    // Schedule next log
                    setTimeout(renderLog, intervalTime + (Math.random() * 200 - 100)); // Add slight randomness
                } else {
                    // Show prompt after logs finish
                    setTimeout(() => {
                        terminalPrompt.style.opacity = '1';
                        typePrompt('AWAITING_COMMAND');
                    }, 400);
                }
            };

            // Progress bar animation
            const updateProgress = () => {
                if (progress <= 100) {
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `${Math.floor(progress)}%`;
                    
                    // Non-linear progress for realism
                    let increment = Math.random() * 4 + 1; 
                    if (progress > 80) increment = Math.random() * 2 + 0.5; // Slow down at end
                    
                    progress += increment;
                    
                    if (progress <= 100) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        progressBar.style.width = '100%';
                        progressText.textContent = '100%';
                        
                        // Optional: Redirect or fade out here after completion
                        setTimeout(() => {
                            // Example transition out
                            document.querySelector('.w-full.max-w-2xl').style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                            document.querySelector('.w-full.max-w-2xl').style.opacity = '0';
                            document.querySelector('.w-full.max-w-2xl').style.transform = 'scale(1.05)';
                        }, 1500);
                    }
                }
            };

            const typePrompt = (text) => {
                const promptSpan = document.getElementById('prompt-text');
                let i = 0;
                const typeChar = () => {
                    if (i < text.length) {
                        promptSpan.textContent += text.charAt(i);
                        i++;
                        setTimeout(typeChar, 50);
                    }
                };
                typeChar();
            };

            // Start sequence
            setTimeout(() => {
                renderLog();
                updateProgress();
            }, 500);
        });
    </script>
