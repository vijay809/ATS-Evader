<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Micro-interaction: Animate circular progress bars on load
        setTimeout(() => {
            const rings = document.querySelectorAll('.match-ring');
            rings.forEach(ring => {
                const score = parseFloat(ring.getAttribute('data-score'));
                const circumference = 2 * Math.PI * 14; // r=14
                const offset = circumference - (score / 100) * circumference;
                ring.style.strokeDashoffset = offset;
            });
        }, 150);
    });
